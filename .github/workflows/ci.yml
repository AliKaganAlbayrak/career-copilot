name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend testleri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Bağımlılıklar
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: pytest
        working-directory: backend
        run: python -m pytest -q
