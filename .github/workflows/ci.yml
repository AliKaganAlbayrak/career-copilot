name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend testleri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Bağımlılıklar
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend-build:
    name: Frontend derlemesi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bağımlılıklar
        working-directory: frontend
        run: npm install

      - name: Tip kontrolü ve derleme
        working-directory: frontend
        run: npm run build
